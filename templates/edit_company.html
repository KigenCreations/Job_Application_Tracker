{% extends "base.html" %}

{% block title %}CareerTrack | Edit Company{% endblock %}

{% block content %}

<h2>Edit Company</h2>
<p>Update the company information below.</p>

<div class="form-card">
    <form action="{{ url_for('edit_company', company_id=company.company_id) }}"
          method="POST">

        <div class="form-grid">

            <div class="form-group">
                <label for="company_name">Company Name</label>
                <input type="text" id="company_name"
                       name="company_name"
                       value="{{ company.company_name }}"
                       required>
            </div>

            <div class="form-group">
                <label for="industry">Industry</label>
                <input type="text" id="industry"
                       name="industry"
                       value="{{ company.industry or '' }}">
            </div>

            <div class="form-group">
                <label for="website">Website</label>
                <input type="text" id="website"
                       name="website"
                       value="{{ company.website or '' }}">
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city"
                       name="city"
                       value="{{ company.city or '' }}">
            </div>

            <div class="form-group">
                <label for="state">State</label>
                <input type="text" id="state"
                       name="state"
                       value="{{ company.state or '' }}">
            </div>

            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes"
                          name="notes">{{ company.notes or '' }}</textarea>
            </div>

        </div>

        <div class="form-actions">
            <button type="submit">Save Changes</button>
            <a href="{{ url_for('companies') }}" class="cancel-btn">Cancel</a>
        </div>

    </form>
</div>

{% endblock %}
