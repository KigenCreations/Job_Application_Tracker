
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">
    <title>{% block title %}CareerTrack{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header class="site-header">
    <div class="hero">
        <h1>CareerTrack</h1>
        <img src="{{ url_for('static', filename='images/briefcase.png') }}"
         alt="Briefcase icon"
         class="hero-icon">
        <p>Your career journey, organized.</p>

        <nav class="main-nav">
            <a href="{{ url_for('dashboard') }}"
               class="{% if request.endpoint == 'dashboard' %}active{% endif %}">
                Dashboard
            </a>

            <a href="{{ url_for('companies') }}"
               class="{% if request.endpoint == 'companies' %}active{% endif %}">
                Companies
            </a>

            <a href="{{ url_for('jobs') }}"
               class="{% if request.endpoint == 'jobs' %}active{% endif %}">
                Jobs
            </a>

            <a href="{{ url_for('applications') }}"
               class="{% if request.endpoint == 'applications' %}active{% endif %}">
                Applications
            </a>

            <a href="{{ url_for('contacts') }}"
               class="{% if request.endpoint == 'contacts' %}active{% endif %}">
                Contacts
            </a>

            <a href="{{ url_for('job_match') }}"
               class="{% if request.endpoint == 'job_match' %}active{% endif %}">
                Job Match
            </a>
        </nav>
    </div>
</header>

<main class="page-content">
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <p>Genesis M. Salazar | Florida International University</p>
    <p>COP 4751 | Advanced Database Management | Final Project</p>
    <p>&copy; 2026 CareerTrack</p>
</footer>

</body>
</html>
